# Base outline relative to base_link (front, left). Tune after measuring the car.
footprint: [[0.18, 0.10], [0.18, -0.10], [-0.12, -0.10], [-0.12, 0.10]]
footprint_padding: 0.02

transform_tolerance: 0.5
resolution: 0.05

obstacle_layer:
  enabled: true
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    data_type: LaserScan
    topic: /scan
    sensor_frame: laser_link
    marking: true
    clearing: true
    obstacle_range: 3.5
    raytrace_range: 4.0
    inf_is_valid: true

inflation_layer:
  enabled: true
  inflation_radius: 0.45
  cost_scaling_factor: 4.0
