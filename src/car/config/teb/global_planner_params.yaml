GlobalPlanner:
  allow_unknown: true            # 允許穿過未知區域
  default_tolerance: 0.5         # 當目標點在障礙物附近時，允許尋找周圍 0.5 米內的替代點
  use_dijkstra: true             # 使用 Dijkstra 演算法（比 A* 更穩定不易失敗）
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false      # 關閉舊版 navfn 的 bug 行為
  
  visualize_potential: false
  planner_window_x: 0.0
  planner_window_y: 0.0